<!DOCTYPE html>
<html lang="en">
<head>
  <base href="/">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Capoeira Maria Rosa</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Roboto', sans-serif;
    }

    :root {
      --primary-color: #008754;
      --secondary-color: #ffd700;
      --border-color: #ccc;
      --hover-color: #00a15d;
    }

    body {
      background: #f5f5f5;
      color: #333;
    }

    .header {
      background: var(--primary-color);
      color: white;
      padding: 20px 0;
      text-align: center;
    }

    .logo {
      width: 150px;
      height: 150px;
    }

    .nav {
      background: var(--secondary-color);
      padding: 15px;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .nav ul {
      display: flex;
      justify-content: center;
      list-style: none;
      gap: 30px;
    }

    .nav a {
      color: #000;
      text-decoration: none;
      font-weight: bold;
      transition: color 0.3s;
    }

    .nav a:hover {
      color: var(--primary-color);
    }

    .section {
      padding: 40px 20px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .events-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
    }

    .event-card {
      background: white;
      border-radius: 10px;
      padding: 20px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      transition: transform 0.3s;
    }

    .event-card:hover {
      transform: translateY(-5px);
    }

    .content {
      padding: 10px;
      background: white;
      border-radius: 10px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }

    .gallery-item {
      border-radius: 10px;
      overflow: hidden;
      position: relative;
      aspect-ratio: 1;
      background: #ddd;
    }

    .gallery-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .contact-info {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .social-links {
      display: flex;
      gap: 20px;
    }

    .social-link {
      color: var(--primary-color);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .social-link svg {
      width: 24px;
      height: 24px;
    }

    /* Estilo para as mensagens */
    .message-card {
      background: white;
      border-radius: 10px;
      padding: 20px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      margin-bottom: 20px;
    }

    .message-card h3 {
      margin-bottom: 10px;
    }

    .message-card p {
      font-size: 16px;
    }

    .message-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
    }

    .arrows {
      display: flex;
      gap: 10px;
      justify-content: space-between;
      width: 60px;
    }

    .arrow {
      cursor: pointer;
      font-size: 24px;
      color: var(--primary-color);
      transition: color 0.3s;
    }

    .arrow:hover {
      color: var(--hover-color);
    }

    .message-form {
      margin-top: 40px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .message-form input, .message-form textarea {
      padding: 15px;
      font-size: 16px;
      border-radius: 5px;
      border: 1px solid var(--border-color);
      transition: border-color 0.3s;
    }

    .message-form input:focus, .message-form textarea:focus {
      border-color: var(--primary-color);
      outline: none;
    }

    .message-form button {
      padding: 15px;
      background-color: var(--primary-color);
      color: white;
      font-size: 16px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    .message-form button:hover {
      background-color: var(--hover-color);
    }

    /* Estilo responsivo */
    @media (max-width: 768px) {
      .nav ul {
        flex-direction: column;
        align-items: center;
      }
    }
  </style>
</head>
<body>

<header class="header">
  <svg class="logo" viewBox="0 0 100 100">
    <circle cx="50" cy="50" r="45" fill="var(--secondary-color)"/>
    <text x="50" y="55" text-anchor="middle" fill="var(--primary-color)" font-size="20">Capoeira</text>
  </svg>
  <h1>Capoeira Maria Rosa</h1>
</header>

<nav class="nav">
  <ul>
    <li><a href="#galeria">Galeria</a></li>
    <li><a href="#infos">Mensagens</a></li>
    <li><a href="#contato">Contato</a></li>
  </ul>
</nav>

<section id="galeria" class="section">
  <h2>Galeria</h2>
  <div class="gallery">
    <div class="gallery-item"><img id="img1" src="fts/ft1.jpg" alt="Foto 1"></div>
    <div class="gallery-item"><img id="img2" src="fts/ft2.jpg" alt="Foto 2"></div>
    <div class="gallery-item"><img id="img3" src="fts/ft3.jpg" alt="Foto 3"></div>
  </div>
</section>

<section id="infos" class="section">
  <h2>Mensagens</h2>
  <section id="eventos" class="section">
    <div class="events-container" id="messages-container">
      <!-- As mensagens serão inseridas aqui via JavaScript -->
    </div>
    <div class="message-container">
      <div class="arrows" id="arrows-container">
        <span class="arrow" id="prev-msg">&#8592;</span>
        <span class="arrow" id="next-msg">&#8594;</span>
      </div>
    </div>
  </section>

  <div class="message-form">
    <h3>Adicionar Mensagem</h3>
    <input type="text" id="message-name" placeholder="Seu nome" />
    <textarea id="message-text" placeholder="Escreva sua mensagem"></textarea>
    <button onclick="addMessage()">Enviar</button>
  </div>
</section>


<section id="contato" class="section">
  <h2>Contato</h2>

        </svg>
        WhatsApp

    </div>
  <p>Professora: Intrutora Cinderela</p>

</section>
<script src="script.js"></script>
</body>
</html>
